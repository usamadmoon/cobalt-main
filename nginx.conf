worker_processes 1;

events {
    worker_connections 128;
}

http {
    # Avoid buffering media tunnels into nginx memory
    proxy_request_buffering off;
    proxy_buffering off;

    server {
        listen 80;
        client_max_body_size 0;

        location / {
            proxy_pass http://cobalt:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Upstream already sets CORS; keep CORP for browsers that hit :9000 directly
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Expose-Headers;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Ratelimit-Limit,Ratelimit-Policy,Ratelimit-Remaining,Ratelimit-Reset,Content-Disposition,Estimated-Content-Length,Content-Length" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, cf-turnstile-response";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Large / long downloads
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_max_temp_file_size 0;
        }
    }
}
